<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CLMTP WMS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1e2330" />

    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icon-144.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icon-128.png" />
    <link rel="apple-touch-icon" sizes="96x96"  href="/icon-96.png" />
    <link rel="apple-touch-icon" sizes="72x72"  href="/icon-72.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icon-96.png" />

    <title>CLMTP WMS</title>

    <style>
      #splash{position:fixed;inset:0;background:#1e2330;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s;}
      #splash.hidden{opacity:0;pointer-events:none;}
      .s-logo{width:90px;height:90px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;color:#fff;font-family:Arial;margin-bottom:24px;box-shadow:0 20px 60px rgba(59,130,246,0.5);}
      .s-title{color:#fff;font-size:24px;font-weight:800;font-family:Arial;margin-bottom:8px;letter-spacing:-0.5px;}
      .s-sub{color:#6b7280;font-size:14px;font-family:Arial;margin-bottom:48px;}
      .s-bar{width:48px;height:4px;background:#374151;border-radius:99px;overflow:hidden;}
      .s-fill{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:99px;animation:ld 1.8s ease forwards;}
      @keyframes ld{to{width:100%;}}
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="s-logo">W</div>
      <div class="s-title">CLMTP WMS</div>
      <div class="s-sub">Gestion d'entrepôt multi-sites</div>
      <div class="s-bar"><div class="s-fill"></div></div>
    </div>

    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Prompt installation PWA
      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        window.__pwaPrompt = e;
        window.dispatchEvent(new Event('pwa-installable'));
      });

      // Masquer splash
      window.addEventListener('load', () => {
        setTimeout(() => {
          const s = document.getElementById('splash');
          if(s){ s.classList.add('hidden'); setTimeout(()=>s.remove(),500); }
        }, 1800);
      });
    </script>
  </body>
</html>
